<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Travel Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #ccfbf1;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Header --- */
  header {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    padding: 1rem 1.5rem;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .header-title h1 {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .header-title p {
    font-size: 0.78rem;
    opacity: 0.88;
    font-weight: 500;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  /* --- Dialogue Chat Log --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.agent .avatar {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
  }
  .msg-row.user .avatar {
    background: #334155;
    color: #fff;
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg-row.user .msg-content {
    align-items: flex-end;
  }

  .sender-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 0 0.25rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    border-top-right-radius: 4px;
  }
  .msg-row.agent .bubble {
    background: var(--card-bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  /* When reply is rich A2UI card */
  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    white-space: normal;
  }

  /* --- Example Prompt Chips Bar --- */
  .prompts-wrapper {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 0.65rem 1rem 0;
  }
  .prompts-container {
    display: flex;
    gap: 0.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    padding-bottom: 0.4rem;
    scrollbar-width: none;
  }
  .prompts-container::-webkit-scrollbar { display: none; }
  .prompt-chip {
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .prompt-chip:hover {
    background: var(--accent-light);
    color: var(--accent-dark);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* --- Form & Input Bar --- */
  form {
    background: var(--card-bg);
    padding: 0.75rem 1rem 1rem;
    border-top: 1px solid transparent;
  }
  .input-container {
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    padding: 0.35rem 0.4rem 0.35rem 1.1rem;
    transition: all 0.2s ease;
  }
  .input-container:focus-within {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
  }
  input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-primary);
    outline: none;
  }
  input::placeholder { color: #94a3b8; }

  button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.3);
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(13, 148, 136, 0.4);
  }

  /* --- Typing Indicator --- */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.4rem 0.6rem;
  }
  .typing-dots span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.15rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent-dark); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">✈️</div>
    <div class="header-title">
      <h1>Smart Travel Concierge</h1>
      <p>AI Travel & Destination Assistant</p>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span> Online
  </div>
</header>

<div id="log">
  <div class="msg-row agent">
    <div class="avatar">✈️</div>
    <div class="msg-content">
      <span class="sender-label">Concierge AI</span>
      <div class="bubble">Hello! I'm your Smart Travel Concierge. Ask me about destinations, live weather, currency exchange rates, nearby places, or to generate custom travel imagery!</div>
    </div>
  </div>
</div>

<div class="prompts-wrapper">
  <div class="prompts-container">
    <button type="button" class="prompt-chip" onclick="sendPrompt('Explore cultural destinations in the catalog')">Explore Cultural Destinations 🏛️</button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('What is the live weather in Tokyo and JPY exchange rate?')">Tokyo Weather & JPY Rates 💴</button>
    <button type="button" class="prompt-chip" onclick="sendPrompt('Generate a vibrant travel image of Kyoto in spring')">Generate Kyoto Spring Image 🌸</button>
  </div>
</div>

<form id="form">
  <div class="input-container">
    <input id="input" placeholder="Ask Concierge AI about your next trip..." autocomplete="off" autofocus>
    <button type="submit" title="Send message">
      <span class="material-symbols-outlined" style="color:#ffffff; font-size:1.3rem;">send</span>
    </button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const content = el("div", "msg-content");
  const label = el("span", "sender-label", who === "user" ? "You" : "Concierge AI");
  const b = el("div", "bubble");

  content.appendChild(label);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTyping() {
  const b = bubble("agent");
  const dots = el("div", "typing-dots");
  dots.appendChild(el("span"));
  dots.appendChild(el("span"));
  dots.appendChild(el("span"));
  b.appendChild(dots);
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = showTyping();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
